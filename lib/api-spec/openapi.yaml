openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: events
    description: Events
  - name: fans
    description: Fan profiles
  - name: venues
    description: Venue profiles
  - name: artists
    description: Artist profiles
  - name: messages
    description: Chat messaging
  - name: ratings
    description: Ratings
  - name: geo
    description: Location search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings:
    get:
      operationId: getAccountSettings
      tags: [auth]
      summary: Get account settings
      responses:
        "200":
          description: Account settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/username:
    patch:
      operationId: changeUsername
      tags: [auth]
      summary: Change username (30-day cooldown)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUsernameInput"
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/avatar:
    patch:
      operationId: changeAvatar
      tags: [auth]
      summary: Update profile picture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAvatarInput"
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/location:
    patch:
      operationId: changeLocation
      tags: [auth]
      summary: Set home location (geocoded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLocationInput"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Geocoding service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /geo/search:
    get:
      operationId: searchGeoPlaces
      tags: [geo]
      summary: Search for real cities, towns, or postal codes
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoPlaceList"
        "502":
          description: Geocoding service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List upcoming events
      parameters:
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
          description: Filter by venue name or address substring
        - in: query
          name: city
          schema:
            type: string
          description: Filter by city or town name in venue address
        - in: query
          name: skipProximity
          schema:
            type: string
          description: When "true", skip radius filter (for active search filters)
        - in: query
          name: nearLat
          schema:
            type: number
          description: Center latitude for proximity filter
        - in: query
          name: nearLng
          schema:
            type: number
          description: Center longitude for proximity filter
        - in: query
          name: radiusKm
          schema:
            type: number
          description: Radius in km (default 10, min 1, max 10)
        - in: query
          name: artistName
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (venue only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a venue account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event (venue owner only)
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not the venue owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /events/{id}/outreach:
    get:
      operationId: listEventOutreach
      tags: [events]
      summary: List artist outreach for an event (venue owner only)
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOutreachList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not the venue owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: upsertEventOutreach
      tags: [events]
      summary: Add or update artist outreach for an event (venue owner only)
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertEventOutreachInput"
      responses:
        "200":
          description: Updated outreach entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOutreachEntry"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not the venue owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /events/{id}/artists/{artistId}:
    delete:
      operationId: removeEventArtist
      tags: [events]
      summary: Remove a confirmed artist from the event lineup (venue owner only)
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: artistId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Artist removed from lineup
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not the venue owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me:
    get:
      operationId: getFanMe
      tags: [fans]
      summary: Get current fan profile
      responses:
        "200":
          description: Fan profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateFanMe
      tags: [fans]
      summary: Update current fan profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FanOnboardingInput"
      responses:
        "200":
          description: Updated fan profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me/followed-artists:
    get:
      operationId: listFollowedArtists
      tags: [fans]
      summary: List artists the current fan follows
      responses:
        "200":
          description: Followed artists with recent gig info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowedArtistList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Fan profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me/follow/{artistId}:
    post:
      operationId: followArtist
      tags: [fans]
      summary: Follow an artist
      parameters:
        - in: path
          name: artistId
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Now following
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: unfollowArtist
      tags: [fans]
      summary: Unfollow an artist
      parameters:
        - in: path
          name: artistId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unfollowed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me/followed-venues:
    get:
      operationId: listFollowedVenues
      tags: [fans]
      summary: List venues the current fan follows
      responses:
        "200":
          description: Followed venues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowedVenueList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me/follow-venue/{venueId}:
    post:
      operationId: followVenue
      tags: [fans]
      summary: Follow a venue
      parameters:
        - in: path
          name: venueId
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Now following
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: unfollowVenue
      tags: [fans]
      summary: Unfollow a venue
      parameters:
        - in: path
          name: venueId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unfollowed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me/rating-summary:
    get:
      operationId: getFanRatingSummary
      tags: [fans]
      summary: Get fan's most recent rating activity summary
      responses:
        "200":
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/{id}:
    get:
      operationId: getFan
      tags: [fans]
      summary: Get fan profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fan profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /artists:
    get:
      operationId: listArtists
      tags: [artists]
      summary: Search artists
      parameters:
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: minRate
          schema:
            type: integer
        - in: query
          name: maxRate
          schema:
            type: integer
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: eventDate
          schema:
            type: string
            format: date-time
          description: Filter to artists available on this date (not blocked)
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Artist search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistList"

  /artists/{id}:
    get:
      operationId: getArtist
      tags: [artists]
      summary: Get public artist profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistPublicProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /artists/me:
    get:
      operationId: getArtistMe
      tags: [artists]
      summary: Get current artist public profile
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistPublicProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateArtistMe
      tags: [artists]
      summary: Update current artist profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistOnboardingInput"
      responses:
        "200":
          description: Updated artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /artists/me/gigs:
    get:
      operationId: listArtistGigs
      tags: [artists]
      summary: List upcoming gigs for the current artist (confirmed lineup + pending invites)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Upcoming gigs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistGigList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /artists/me/blocked-dates:
    get:
      operationId: listBlockedDates
      tags: [artists]
      summary: List blocked availability dates
      responses:
        "200":
          description: Blocked dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedDateList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addBlockedDate
      tags: [artists]
      summary: Block a date from availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBlockedDateInput"
      responses:
        "201":
          description: Date blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddBlockedDateResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /artists/me/blocked-dates/{date}:
    delete:
      operationId: removeBlockedDate
      tags: [artists]
      summary: Remove a blocked date
      parameters:
        - in: path
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "204":
          description: Removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /messages/conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List chat conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start a conversation by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationStarted"

  /messages/conversations/{id}:
    get:
      operationId: getConversation
      tags: [messages]
      summary: Get conversation messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: closeConversation
      tags: [messages]
      summary: Close a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Closed

  /messages/conversations/{conversationId}/gig-invites:
    get:
      operationId: listConversationGigInvites
      tags: [messages]
      summary: List pending gig invites in this conversation (artist only)
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pending gig invites from this venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GigInviteList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an artist or not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /messages/conversations/{conversationId}/gig-invites/{outreachId}/respond:
    post:
      operationId: respondToGigInvite
      tags: [messages]
      summary: Accept or decline a gig invite (artist only)
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: integer
        - in: path
          name: outreachId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToGigInviteInput"
      responses:
        "200":
          description: Updated outreach entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOutreachEntry"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /messages/users/search:
    get:
      operationId: searchChatUsers
      tags: [messages]
      summary: Search users to start a chat
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUserSearchList"

  /ratings:
    post:
      operationId: createRating
      tags: [ratings]
      summary: Rate an artist or venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingInput"
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingCreated"
        "429":
          description: Cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ratings/{targetType}/{targetId}:
    get:
      operationId: getRatingSummary
      tags: [ratings]
      summary: Get average rating for target
      parameters:
        - in: path
          name: targetType
          required: true
          schema:
            type: string
            enum: [artist, venue]
        - in: path
          name: targetId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingSummary"

  /venues/me:
    get:
      operationId: getVenueMe
      tags: [venues]
      summary: Get current venue profile
      responses:
        "200":
          description: Venue profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateVenueMe
      tags: [venues]
      summary: Update current venue profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueOnboardingInput"
      responses:
        "200":
          description: Updated venue profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get venue by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Venue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UserSession:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        locationLabel:
          type: ["string", "null"]
        locationLat:
          type: ["number", "null"]
        locationLng:
          type: ["number", "null"]

    AccountSettings:
      type: object
      required: [id, username, email, role, canChangeUsername]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        usernameChangedAt:
          type: ["string", "null"]
          format: date-time
        canChangeUsername:
          type: boolean
        nextUsernameChangeAt:
          type: ["string", "null"]
          format: date-time
        locationLabel:
          type: ["string", "null"]
        locationLat:
          type: ["number", "null"]
        locationLng:
          type: ["number", "null"]

    GeoPlace:
      type: object
      required: [label, lat, lng]
      properties:
        label:
          type: string
        lat:
          type: number
        lng:
          type: number

    GeoPlaceList:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            $ref: "#/components/schemas/GeoPlace"

    ChangeLocationInput:
      type: object
      properties:
        query:
          type: string
          minLength: 0
          maxLength: 120
        locationLabel:
          type: string
        lat:
          type: number
        lng:
          type: number

    ChangeUsernameInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 20

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangeAvatarInput:
      type: object
      properties:
        avatarUrl:
          type: ["string", "null"]

    PasswordChangeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    SignupInput:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 20
        email:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
        displayName:
          type: string
        location:
          type: string
        genres:
          type: array
          items:
            type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Venue:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        description:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        moods:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        ownerUsername:
          type: string
          description: Venue account username (for artist messaging)

    ArtistSummary:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        genres:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]

    CreateEventInput:
      type: object
      required: [title, eventDate]
      properties:
        title:
          type: string
          maxLength: 100
          description: Short event title
        description:
          type: ["string", "null"]
          description: Event description for fans (200 words or less)
        artistRequirements:
          type: ["string", "null"]
          description: What kind of artist the host is looking for (200 words or less)
        imageUrls:
          type: array
          items:
            type: string
          description: Subset of venue's uploaded photos to feature for this event
        genres:
          type: array
          items:
            type: string
          description: Music genres for the event (from VENUE_GENRES list)
        isPaid:
          type: boolean
          default: false
        payAmount:
          type: ["string", "null"]
          description: e.g. "$150" or "tips only"
        isCompetition:
          type: boolean
          default: false
        competitionLevel:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
          description: 1-5 only if isCompetition true
        eventDate:
          type: string
          format: date-time
          description: Start date and time of event
        durationMinutes:
          type: ["integer", "null"]
          minimum: 15
          description: Length of the slot in minutes

    EventSummary:
      type: object
      required: [id, title, eventDate, venue]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        artistRequirements:
          type: ["string", "null"]
        imageUrls:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        isPaid:
          type: boolean
        payAmount:
          type: ["string", "null"]
        isCompetition:
          type: boolean
        competitionLevel:
          type: ["integer", "null"]
        eventDate:
          type: string
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
        status:
          type: string
        artistCount:
          type: integer
        artistIds:
          type: array
          items:
            type: integer
          description: IDs of confirmed performing artists
        venue:
          $ref: "#/components/schemas/Venue"

    UpdateEventInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: ["string", "null"]
        artistRequirements:
          type: ["string", "null"]
        imageUrls:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        isPaid:
          type: boolean
        payAmount:
          type: ["string", "null"]
        isCompetition:
          type: boolean
        competitionLevel:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        eventDate:
          type: string
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
          minimum: 15
        status:
          type: string
          enum: [upcoming, finalized]
          description: upcoming = planning; finalized = venue locked lineup for fans

    EventOutreachEntry:
      type: object
      required: [id, artistId, displayName, status]
      properties:
        id:
          type: integer
        artistId:
          type: integer
        displayName:
          type: string
        username:
          type: string
        genres:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [contacted, pending, confirmed, declined]
        notes:
          type: ["string", "null"]
        eventId:
          type: integer
        eventTitle:
          type: string
        eventDate:
          type: string
          format: date-time

    EventOutreachList:
      type: object
      required: [outreach]
      properties:
        outreach:
          type: array
          items:
            $ref: "#/components/schemas/EventOutreachEntry"

    UpsertEventOutreachInput:
      type: object
      required: [artistId, status]
      properties:
        artistId:
          type: integer
        status:
          type: string
          enum: [contacted, pending, confirmed, declined]
        notes:
          type: ["string", "null"]

    GigInviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/GigInvite"

    GigInvite:
      type: object
      required: [outreachId, eventId, eventTitle, eventDate, venueId, venueName, status]
      properties:
        outreachId:
          type: integer
        eventId:
          type: integer
        eventTitle:
          type: string
        eventDate:
          type: string
          format: date-time
        venueId:
          type: integer
        venueName:
          type: string
        status:
          type: string
          enum: [pending]

    RespondToGigInviteInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, decline]

    EventDetail:
      type: object
      required: [id, title, eventDate, venue]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        artistRequirements:
          type: ["string", "null"]
        imageUrls:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        isPaid:
          type: boolean
        payAmount:
          type: ["string", "null"]
        isCompetition:
          type: boolean
        competitionLevel:
          type: ["integer", "null"]
        eventDate:
          type: string
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
        status:
          type: string
        artistCount:
          type: integer
        venue:
          $ref: "#/components/schemas/Venue"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"

    EventList:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        total:
          type: integer

    FanOnboardingInput:
      type: object
      required: [displayName, genres]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        avatarUrl:
          type: string
        location:
          type: string
        genres:
          type: array
          items:
            type: string
        spotifyUrl:
          type: string
        appleMusicUrl:
          type: string
        tidalUrl:
          type: string

    ArtistOnboardingInput:
      type: object
      required: [displayName, genres, vibes]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        avatarUrl:
          type: string
        bio:
          type: string
        genres:
          type: array
          items:
            type: string
        vibes:
          type: array
          items:
            type: string
        spotifyUrl:
          type: string
        youtubeUrl:
          type: string

    VenueOnboardingInput:
      type: object
      required: [name, address, lat, lng, moods]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        address:
          type: string
          minLength: 1
          description: Full address label from geocoding suggestion
        lat:
          type: number
          description: WGS84 latitude from geocoding suggestion
        lng:
          type: number
          description: WGS84 longitude from geocoding suggestion
        description:
          type: string
        size:
          type: string
        moods:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string

    ArtistProfile:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        vibes:
          type: array
          items:
            type: string
        spotifyUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]

    FanProfile:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        location:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        spotifyUrl:
          type: ["string", "null"]
        appleMusicUrl:
          type: ["string", "null"]
        tidalUrl:
          type: ["string", "null"]

    FollowedArtistRecentGig:
      type: object
      required: [eventId, title, venueName, venueAddress, eventDate, status]
      properties:
        eventId:
          type: integer
        title:
          type: string
        venueName:
          type: string
        venueAddress:
          type: string
        eventDate:
          type: string
          format: date-time
        status:
          type: string

    FollowedArtistSummary:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        recentGig:
          oneOf:
            - $ref: "#/components/schemas/FollowedArtistRecentGig"
            - type: "null"

    FollowedArtistList:
      type: object
      required: [artists]
      properties:
        artists:
          type: array
          items:
            $ref: "#/components/schemas/FollowedArtistSummary"

    FollowedVenueSummary:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        description:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]

    FollowedVenueList:
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          items:
            $ref: "#/components/schemas/FollowedVenueSummary"

    ArtistSearchResult:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        vibes:
          type: array
          items:
            type: string
        spotifyUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        rateTier:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]
        username:
          type: string

    ArtistList:
      type: object
      required: [artists]
      properties:
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSearchResult"

    ArtistGigSummary:
      type: object
      required: [eventId, title, eventDate, eventStatus, gigStatus, venue]
      properties:
        eventId:
          type: integer
        outreachId:
          type: ["integer", "null"]
          description: Set when gigStatus is pending (for chat accept flow)
        title:
          type: string
        eventDate:
          type: string
          format: date-time
        eventStatus:
          type: string
          description: Event planning state (upcoming or finalized)
        gigStatus:
          type: string
          enum: [confirmed, pending]
        venue:
          type: object
          required: [id, name, address]
          properties:
            id:
              type: integer
            name:
              type: string
            address:
              type: string
            ownerUsername:
              type: string

    ArtistGigList:
      type: object
      required: [gigs]
      properties:
        gigs:
          type: array
          items:
            $ref: "#/components/schemas/ArtistGigSummary"

    VenuePlayedSummary:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string

    ArtistPublicProfile:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        vibes:
          type: array
          items:
            type: string
        spotifyUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        rateTier:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]
        followerCount:
          type: integer
        venuesPlayed:
          type: array
          items:
            $ref: "#/components/schemas/VenuePlayedSummary"
        ratingAverage:
          type: number
        ratingCount:
          type: integer

    BlockedDateList:
      type: object
      required: [dates]
      properties:
        dates:
          type: array
          items:
            type: string
            format: date

    AddBlockedDateInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date

    AddBlockedDateResult:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date

    ChatUser:
      type: object
      required: [id, username, displayName, role]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        profileId:
          type: ["integer", "null"]
          description: Public profile id (venue id or artist id)

    ChatUserSearchList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ChatUser"

    Message:
      type: object
      required: [id, senderUserId, createdAt]
      properties:
        id:
          type: integer
        senderUserId:
          type: integer
        body:
          type: ["string", "null"]
        attachmentUrl:
          type: ["string", "null"]
        attachmentType:
          type: ["string", "null"]
        attachmentName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ConversationSummary:
      type: object
      required: [id, otherUser, updatedAt]
      properties:
        id:
          type: integer
        otherUser:
          $ref: "#/components/schemas/ChatUser"
        lastMessage:
          type: ["object", "null"]
          properties:
            body:
              type: ["string", "null"]
            attachmentType:
              type: ["string", "null"]
            createdAt:
              type: string
              format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"

    ConversationDetail:
      type: object
      required: [id, messages]
      properties:
        id:
          type: integer
        otherUser:
          oneOf:
            - $ref: "#/components/schemas/ChatUser"
            - type: "null"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    ConversationStarted:
      type: object
      required: [id, otherUser]
      properties:
        id:
          type: integer
        otherUser:
          $ref: "#/components/schemas/ChatUser"

    StartConversationInput:
      type: object
      required: [username]
      properties:
        username:
          type: string

    SendMessageInput:
      type: object
      properties:
        body:
          type: string
        attachmentUrl:
          type: string
        attachmentType:
          type: string
          enum: [image, file]
        attachmentName:
          type: string

    CreateRatingInput:
      type: object
      required: [targetType, targetId, score]
      properties:
        targetType:
          type: string
          enum: [artist, venue]
        targetId:
          type: integer
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    RatingCreated:
      type: object
      required: [id, targetType, targetId, score, createdAt]
      properties:
        id:
          type: integer
        targetType:
          type: string
        targetId:
          type: integer
        score:
          type: integer
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RatingSummary:
      type: object
      required: [average, count]
      properties:
        targetType:
          type: string
        targetId:
          type: integer
        average:
          type: number
        count:
          type: integer

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

