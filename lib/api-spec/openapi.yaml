openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: events
    description: Events
  - name: fans
    description: Fan profiles
  - name: venues
    description: Venue profiles
  - name: geo
    description: Location search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings:
    get:
      operationId: getAccountSettings
      tags: [auth]
      summary: Get account settings
      responses:
        "200":
          description: Account settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/username:
    patch:
      operationId: changeUsername
      tags: [auth]
      summary: Change username (30-day cooldown)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUsernameInput"
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/avatar:
    patch:
      operationId: changeAvatar
      tags: [auth]
      summary: Update profile picture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAvatarInput"
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/settings/location:
    patch:
      operationId: changeLocation
      tags: [auth]
      summary: Set home location (geocoded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLocationInput"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Geocoding service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /geo/search:
    get:
      operationId: searchGeoPlaces
      tags: [geo]
      summary: Search for real cities, towns, or postal codes
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoPlaceList"
        "502":
          description: Geocoding service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List upcoming events
      parameters:
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
          description: Filter by venue name or address substring
        - in: query
          name: nearLat
          schema:
            type: number
          description: Center latitude for proximity filter
        - in: query
          name: nearLng
          schema:
            type: number
          description: Center longitude for proximity filter
        - in: query
          name: radiusKm
          schema:
            type: number
          description: Radius in km (default 10, min 1, max 10)
        - in: query
          name: artistName
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/me:
    patch:
      operationId: updateFanMe
      tags: [fans]
      summary: Update current fan profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FanOnboardingInput"
      responses:
        "200":
          description: Updated fan profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /fans/{id}:
    get:
      operationId: getFan
      tags: [fans]
      summary: Get fan profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fan profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /artists/me:
    patch:
      operationId: updateArtistMe
      tags: [artists]
      summary: Update current artist profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistOnboardingInput"
      responses:
        "200":
          description: Updated artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /venues/me:
    get:
      operationId: getVenueMe
      tags: [venues]
      summary: Get current venue profile
      responses:
        "200":
          description: Venue profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateVenueMe
      tags: [venues]
      summary: Update current venue profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueOnboardingInput"
      responses:
        "200":
          description: Updated venue profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get venue by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Venue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UserSession:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        locationLabel:
          type: ["string", "null"]
        locationLat:
          type: ["number", "null"]
        locationLng:
          type: ["number", "null"]

    AccountSettings:
      type: object
      required: [id, username, email, role, canChangeUsername]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        usernameChangedAt:
          type: ["string", "null"]
          format: date-time
        canChangeUsername:
          type: boolean
        nextUsernameChangeAt:
          type: ["string", "null"]
          format: date-time
        locationLabel:
          type: ["string", "null"]
        locationLat:
          type: ["number", "null"]
        locationLng:
          type: ["number", "null"]

    GeoPlace:
      type: object
      required: [label, lat, lng]
      properties:
        label:
          type: string
        lat:
          type: number
        lng:
          type: number

    GeoPlaceList:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            $ref: "#/components/schemas/GeoPlace"

    ChangeLocationInput:
      type: object
      properties:
        query:
          type: string
          minLength: 0
          maxLength: 120
        locationLabel:
          type: string
        lat:
          type: number
        lng:
          type: number

    ChangeUsernameInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 20

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangeAvatarInput:
      type: object
      properties:
        avatarUrl:
          type: ["string", "null"]

    PasswordChangeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    SignupInput:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 20
        email:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
        displayName:
          type: string
        location:
          type: string
        genres:
          type: array
          items:
            type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Venue:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        description:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        moods:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]

    ArtistSummary:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        genres:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]

    EventSummary:
      type: object
      required: [id, title, eventDate, venue]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        isPaid:
          type: boolean
        eventDate:
          type: string
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
        status:
          type: string
        artistCount:
          type: integer
        venue:
          $ref: "#/components/schemas/Venue"

    EventDetail:
      type: object
      required: [id, title, eventDate, venue]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        isPaid:
          type: boolean
        eventDate:
          type: string
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
        status:
          type: string
        artistCount:
          type: integer
        venue:
          $ref: "#/components/schemas/Venue"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"

    EventList:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        total:
          type: integer

    FanOnboardingInput:
      type: object
      required: [displayName, genres]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        avatarUrl:
          type: string
        location:
          type: string
        genres:
          type: array
          items:
            type: string

    ArtistOnboardingInput:
      type: object
      required: [displayName, genres, vibes]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        avatarUrl:
          type: string
        bio:
          type: string
        genres:
          type: array
          items:
            type: string
        vibes:
          type: array
          items:
            type: string
        spotifyUrl:
          type: string
        youtubeUrl:
          type: string

    VenueOnboardingInput:
      type: object
      required: [name, address, lat, lng, moods]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        address:
          type: string
          minLength: 1
          description: Full address label from geocoding suggestion
        lat:
          type: number
          description: WGS84 latitude from geocoding suggestion
        lng:
          type: number
          description: WGS84 longitude from geocoding suggestion
        description:
          type: string
        size:
          type: string
        moods:
          type: array
          items:
            type: string

    ArtistProfile:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        vibes:
          type: array
          items:
            type: string
        spotifyUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]

    FanProfile:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
        location:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string

