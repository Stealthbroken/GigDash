kind = "web"
previewPath = "/"
title = "GigDash"
version = "1.0.0"
id = "artifacts/gigdash"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23879

[services.development]
run = "pnpm --filter @workspace/gigdash run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gigdash", "run", "build" ]
publicDir = "artifacts/gigdash/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23879"
BASE_PATH = "/"
